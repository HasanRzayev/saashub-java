version: '3.8'

services:
  saashub-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saashub-app
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=saashub_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: saashub-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: saashub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - saashub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saashub-redis
    ports:
      - "6381:6379"
    volumes:
      - saashub_redis_data:/data

volumes:
  saashub_postgres_data:
  saashub_redis_data:
